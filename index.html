<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Strangers into Neighbours - Prototype</title>
  <style>
    /* 기본 리셋 및 스타일 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #0f172a; /* 어두운 모던 배경색 */
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      margin-bottom: 24px;
      text-align: center;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 600;
      letter-spacing: -0.025em;
    }

    /* 반응형 피그마 임베드 컨테이너 */
    .prototype-container {
      width: 100%;
      max-width: 900px;
      background-color: #1e293b;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
    }

    .iframe-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 비율 유지 (800x450 비율) */
      height: 0;
      overflow: hidden;
      border-radius: 8px;
    }

    .iframe-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>

  <header>
    <h1>Strangers into Neighbours</h1>
  </header>

  <main class="prototype-container">
    <div class="iframe-wrapper">
      <iframe 
        src="https://embed.figma.com/design/DhDRfLC1PcyweSQTAHm9c4/Strangers-into-Neighbours?node-id=26-19&embed-host=share" 
        allowfullscreen>
      </iframe>
    </div>
  </main>

</body>
</html>
